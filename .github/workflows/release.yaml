name: Release Arch Linux Package

on:
  push:
    tags:
      - 'v*' # Dispara quando você envia uma tag (ex: git push origin v1.0.0)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Usa a imagem oficial do Arch Linux como base para o job
    container:
      image: archlinux:latest

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Capturar versão da tag
        run: |
          # Remove a letra 'v' da tag (ex: v1.0.0 vira 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Atualizar versão no PKGBUILD
        run: |
          # Substitui a versão no arquivo PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Configurar ambiente de build (Arch Linux)
        run: |
          # Instala ferramentas essenciais de empacotamento
          pacman -Syu --noconfirm base-devel sudo git
          
          # O comando 'makepkg' bloqueia a execução como root. 
          # Criando um usuário temporário para o build:
          useradd builduser -m
          passwd -d builduser
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          
          # Dar permissão ao usuário na pasta de trabalho
          chown -R builduser:builduser .

      - name: Gerar Checksums e Pacote
        run: |
          # Atualiza os hashes (sha256sums) no PKGBUILD automaticamente
          su builduser -c "updpkgsums"
          
          # Constrói o pacote pacman (.pkg.tar.zst)
          su builduser -c "makepkg -s --noconfirm"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Faz o upload automático do pacote compilado para a release gerada
          files: "*.pkg.tar.zst"

